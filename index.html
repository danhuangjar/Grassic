<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>welcome to Grassic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #D6E9C3;
            font-family: -apple-system, 'PingFang SC', 'Segoe UI', 'Microsoft YaHei', sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 隐藏的复选框，控制手机端菜单 */
        .menu-toggle {
            display: none;
        }

        /* =========================================
           手机端默认样式（侧边栏隐藏）
           ========================================= */
           
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            height: 100vh;
            background: #D6E9C3; 
            padding: 50px 0 30px 0; /* 上边距从 80px 改小到 50px，项目上移 */
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            box-shadow: 4px 0 20px rgba(0,0,0,0.05);
            z-index: 1000;
            border-right: 2px solid #088D5E; 
            border-radius: 0 12px 12px 0;
        }

        .sidebar label {
            display: block;
            text-decoration: none;
            color: #1a1a1a;
            font-size: 18px;
            font-weight: 600;
            padding: 16px 30px; 
            cursor: pointer;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08); 
            transition: background 0.2s ease;
        }

        .sidebar label:hover {
            background: rgba(0, 0, 0, 0.03); 
        }

        .sidebar label:last-child {
            border-bottom: none;
        }

        /* 右侧主内容区 */
        .main-wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 20px 8px 12px;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #088D5E;
            letter-spacing: 0.5px;
            text-decoration: none;
        }

        /* 手机端菜单按钮（1:1 正方形） */
        .menu-btn {
            width: 20px;
            height: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            z-index: 1001;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-btn span {
            display: block;
            width: 100%;
            height: 2px;
            background: #088D5E;
            border-radius: 1px;
        }

        /* 遮罩层 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(2px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 999;
            pointer-events: none;
        }

        /* ----- 核心交互逻辑（纯 CSS） ----- */
        .menu-toggle:checked ~ .sidebar { transform: translateX(0); }
        .menu-toggle:checked ~ .overlay { opacity: 1; visibility: visible; }
        
        .menu-toggle:checked ~ .main-wrapper .menu-btn { 
            transform: rotate(90deg); 
        }

        .content {
            padding: 20px;
            flex: 1;
        }

        .content h1 {
            font-size: 28px;
            font-weight: 700;
            color: #088D5E;
            margin-bottom: 12px;
            letter-spacing: 0.3px;
        }

        .content p {
            font-size: 15px;
            line-height: 1.6;
            color: #4a5a4e;
        }

        /* =========================================
           电脑端（大屏幕）样式
           ========================================= */
        @media (min-width: 768px) {
            body {
                display: flex;
            }

            .sidebar {
                position: relative;
                transform: none;
                height: auto;
                min-height: 100vh;
                box-shadow: none;
                border-radius: 0;
                background: transparent; 
                border-right: 2px solid #088D5E; 
                width: auto;
                white-space: nowrap;
                padding: 24px 0; /* 电脑端顶部也相应稍微靠上 */
            }

            .sidebar label {
                font-size: 16px;
                color: #4a5a4e;
                padding: 12px 40px;
                border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            }

            .sidebar label:hover {
                color: #088D5E;
                background: rgba(0, 0, 0, 0.03);
            }

            .main-wrapper {
                flex: 1;
                width: auto;
            }

            .menu-btn, .overlay {
                display: none;
            }

            .header { padding: 16px 40px; }
            .content { padding: 40px; }
            .content h1 { font-size: 36px; }
            .content p { font-size: 16px; }
        }
    </style>
</head>
<body>

    <!-- 隐藏的复选框 -->
    <input type="checkbox" id="menuToggle" class="menu-toggle">

    <!-- 侧边栏 -->
    <div class="sidebar">
        <label for="menuToggle">首页</label>
        <!-- 以后加内容直接在这里加 label 即可 -->
    </div>

    <!-- 右侧主内容区 -->
    <div class="main-wrapper">
        <header class="header">
            <span class="logo">grassic</span>
            <!-- 菜单按钮 -->
            <label for="menuToggle" class="menu-btn">
                <span></span>
                <span></span>
                <span></span>
            </label>
        </header>

        <div class="content">
            <h1>hello</h1>
            <p>welcome to grassic</p>
        </div>
    </div>

    <!-- 遮罩层 -->
    <div class="overlay"></div>

</body>
</html>
