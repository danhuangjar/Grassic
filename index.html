<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>welcome to Grassic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #D6E9C3;
            font-family: -apple-system, 'PingFang SC', 'Segoe UI', sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .layout {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            height: 100vh;
            background: #D6E9C3;
            padding: 50px 0;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-right: 2px solid #088D5E;
            border-radius: 0 12px 12px 0;
            z-index: 100;
            will-change: transform;
        }

        .sidebar.active {
            transform: translateX(0);
        }

        .sidebar a {
            display: block;
            color: #1a1a1a;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            padding: 16px 30px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            cursor: pointer;
        }

        .sidebar a:last-child {
            border-bottom: none;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 20px 8px 12px;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #088D5E;
            letter-spacing: 0.5px;
            text-decoration: none;
        }

        .menu-btn {
            width: 20px;
            height: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            z-index: 101;
            transition: transform 0.3s ease-out;
        }

        .menu-btn.active {
            transform: rotate(90deg);
        }

        .menu-btn span {
            display: block;
            width: 100%;
            height: 2px;
            background: #088D5E;
            border-radius: 1px;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            opacity: 0;
            visibility: hidden;
            z-index: 99;
            transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .content {
            padding: 20px;
            flex: 1;
        }

        .content h1 {
            font-size: 28px;
            font-weight: 700;
            color: #088D5E;
            margin-bottom: 12px;
        }

        .content p {
            font-size: 15px;
            line-height: 1.6;
            color: #4a5a4e;
        }

        @media (min-width: 768px) {
            .sidebar {
                position: relative;
                transform: none;
                height: auto;
                background: transparent;
                width: auto;
                padding: 24px 0;
                border-radius: 0;
                will-change: auto;
            }

            .sidebar a {
                font-size: 16px;
                color: #4a5a4e;
                padding: 12px 40px;
            }

            .menu-btn, .overlay {
                display: none;
            }

            .header { padding: 16px 40px; }
            .content { padding: 40px; }
            .content h1 { font-size: 36px; }
            .content p { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="layout">
        <nav class="sidebar" id="sidebar">
            <a href="#">首页</a>
        </nav>

        <div class="main">
            <header class="header">
                <a href="#" class="logo">grassic</a>
                <div class="menu-btn" id="menuBtn">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </header>

            <div class="content">
                <h1>hello</h1>
                <p>welcome to grassic</p>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>

    <script>
        const btn = document.getElementById('menuBtn')
        const sidebar = document.getElementById('sidebar')
        const overlay = document.getElementById('overlay')

        const toggle = () => {
            const isActive = sidebar.classList.toggle('active')
            btn.classList.toggle('active')
            overlay.classList.toggle('active')
            document.body.style.overflow = isActive ? 'hidden' : ''
        }

        btn.addEventListener('click', toggle)

        sidebar.addEventListener('click', (e) => {
            if (e.target.tagName === 'A') {
                if (window.innerWidth < 768) toggle()
            }
        })
    </script>
</body>
</html>
