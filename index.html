<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>welcome to Grassic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #D6E9C3;
            font-family: -apple-system, 'PingFang SC', 'Segoe UI', 'Microsoft YaHei', sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* =========================================
           手机端默认样式
           ========================================= */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            height: 100vh;
            background: #D6E9C3; 
            padding: 50px 0 30px 0; 
            
            /* JS 控制的核心：默认向左平移隐藏 */
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            
            border-right: 2px solid #088D5E; 
            border-radius: 0 12px 12px 0;
            z-index: 1000;
            
            /* 强制开启 GPU 硬件加速，动画不卡顿 */
            will-change: transform;
        }

        /* JS 会加上 .active 类，触发滑出动画 */
        .sidebar.active {
            transform: translateX(0);
        }

        .sidebar label {
            display: block;
            text-decoration: none;
            color: #1a1a1a;
            font-size: 18px;
            font-weight: 600;
            padding: 16px 30px; 
            cursor: pointer;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08); 
        }

        .sidebar label:last-child {
            border-bottom: none;
        }

        .main-wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 20px 8px 12px;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #088D5E;
            letter-spacing: 0.5px;
            text-decoration: none;
        }

        .menu-btn {
            width: 20px;
            height: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            z-index: 1001;
            transition: transform 0.3s ease-out;
            will-change: transform;
        }

        /* JS 会加上 .active 类，触发旋转 */
        .menu-btn.active {
            transform: rotate(90deg);
        }

        .menu-btn span {
            display: block;
            width: 100%;
            height: 2px;
            background: #088D5E;
            border-radius: 1px;
        }

        /* 遮罩层 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.25);
            opacity: 0;
            visibility: hidden;
            z-index: 999;
            /* 去掉 blur 模糊，改用纯透明渐变，性能更好 */
            transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
        }

        /* JS 会加上 .active 类，触发遮罩显示 */
        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .content {
            padding: 20px;
            flex: 1;
        }

        .content h1 {
            font-size: 28px;
            font-weight: 700;
            color: #088D5E;
            margin-bottom: 12px;
            letter-spacing: 0.3px;
        }

        .content p {
            font-size: 15px;
            line-height: 1.6;
            color: #4a5a4e;
        }

        /* =========================================
           电脑端（大屏幕）样式
           ========================================= */
        @media (min-width: 768px) {
            body {
                display: flex;
            }

            .sidebar {
                position: relative;
                /* 电脑端重置位移，直接显示 */
                transform: none;
                height: auto;
                min-height: 100vh;
                background: transparent; 
                border-right: 2px solid #088D5E; 
                width: auto;
                white-space: nowrap;
                padding: 24px 0;
                border-radius: 0;
                box-shadow: none;
                will-change: auto;
            }

            .sidebar label {
                font-size: 16px;
                color: #4a5a4e;
                padding: 12px 40px;
            }

            .main-wrapper {
                flex: 1;
                width: auto;
            }

            .menu-btn, .overlay {
                display: none;
            }

            .header { padding: 16px 40px; }
            .content { padding: 40px; }
            .content h1 { font-size: 36px; }
            .content p { font-size: 16px; }
        }
    </style>
</head>
<body>

    <!-- 侧边栏 -->
    <div class="sidebar" id="sidebar">
        <!-- 点击菜单项也可以关闭菜单 -->
        <label class="close-menu">首页</label>
    </div>

    <!-- 右侧主内容区 -->
    <div class="main-wrapper">
        <header class="header">
            <span class="logo">grassic</span>
            <!-- 菜单按钮 -->
            <div class="menu-btn" id="menuBtn">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </header>

        <div class="content">
            <h1>hello</h1>
            <p>welcome to grassic</p>
        </div>
    </div>

    <!-- 遮罩层 -->
    <div class="overlay" id="overlay"></div>

    <!-- 交互脚本 -->
    <script>
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const closeMenuBtn = document.querySelector('.close-menu');

        // 切换菜单状态的函数
        function toggleMenu() {
            menuBtn.classList.toggle('active');
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
            
            // 菜单打开时，禁止背景滚动
            if (sidebar.classList.contains('active')) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = '';
            }
        }

        // 点击三条杠按钮，切换菜单
        menuBtn.addEventListener('click', toggleMenu);

        // 点击遮罩层空白处，关闭菜单
        overlay.addEventListener('click', toggleMenu);

        // 点击侧边栏里面的文字，关闭菜单
        closeMenuBtn.addEventListener('click', toggleMenu);
    </script>
</body>
</html>
