<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号中心 | Grassic Studio</title>
    <link rel="icon" type="image/svg+xml" href="/G.svg">
    <link rel="stylesheet" href="/auth.css">
</head>
<body>
    <div class="auth-box">
        <h2>账号中心</h2>
        <input id="auth-email" type="email" placeholder="邮箱地址">
        <input id="auth-password" type="password" placeholder="密码（至少 6 位）">

        <div class="btn-group">
            <button class="btn-login" onclick="doLogin()">登录</button>
            <button class="btn-register" onclick="doRegister()">注册</button>
        </div>

        <a href="/zh/" class="back-link">&larr; 返回中文主页</a>
    </div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
        const supabase = createClient('https://eilhhwsbawpvfjmtjwbi.supabase.co', 'sb_publishable_b6M1Xyi2aTEH67iH20IcGw_DqLdwbEn')

        window.doLogin = async () => {
            const email = document.getElementById('auth-email').value
            const password = document.getElementById('auth-password').value
            if (!email || !password) return alert("请填写邮箱和密码。")

            const { data, error } = await supabase.auth.signInWithPassword({ email, password })
            if (error) alert('登录失败: ' + error.message)
            else window.location.href = '/zh/' 
        }

        window.doRegister = async () => {
            const email = document.getElementById('auth-email').value
            const password = document.getElementById('auth-password').value
            if (!email || !password) return alert("请填写邮箱和密码。")
            if (password.length < 6) return alert("密码至少需要 6 个字符。")

            const { data, error } = await supabase.auth.signUp({ email, password })
            if (error) alert('注册失败: ' + error.message)
            else alert('注册成功！请点击登录。')
        }
    </script>
</body>
</html>
