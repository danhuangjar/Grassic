<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grassic-OS | 独立操作系统项目</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #dcedc8; color: #333; line-height: 1.6; }
        .content, .sidebar, .mobile-header, .mobile-menu { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        
        .sidebar {
            width: 160px; 
            padding: 40px 15px;
            border-right: 2px solid #43961c; 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }

        .brand-logo { width: 100px; height: auto; display: block; }
        .lang-link { color: #43961c; text-decoration: none; font-size: 0.9rem; display: block;}
        .lang-link:hover { text-decoration: underline; }

        .content { 
            margin-left: 160px; 
            padding: 40px 50px; 
            max-width: 800px; 
            box-sizing: border-box; 
        }

        .desktop-auth-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        h1 { color: #43961c; font-size: 2.8rem; margin-top: 0; margin-bottom: 10px; font-family: monospace; }
        h3 { font-size: 1.15rem; color: #555; font-weight: 400; margin-top: 0; margin-bottom: 30px; }
        p { margin-bottom: 15px; font-size: 1rem; }
        a.main-link { color: #43961c; font-weight: 600; text-decoration: none; border-bottom: 1px dashed #43961c; }
        a.main-link:hover { background-color: #c5e1a5; }
        .footer { margin-top: 50px; font-size: 0.85rem; color: #666; border-top: 1px solid #aed581; padding-top: 15px; }

        .auth-area button {
            padding: 8px 16px; background-color: #43961c; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: 0.2s;
        }
        .auth-area button:hover { background-color: #327513; }
        
        .user-info { display: flex; align-items: center; gap: 15px; font-size: 0.9rem; color: #555; }
        .user-info strong { color: #43961c; }
        .logout-btn { background-color: #d32f2f !important; padding: 6px 12px !important; font-size: 0.85rem !important; }
        .logout-btn:hover { background-color: #b71c1c !important; }

        .test-box { margin-top: 30px; padding: 20px; border: 2px dashed #aed581; border-radius: 8px; background-color: rgba(255, 255, 255, 0.4); }
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .input-group input { flex: 1; padding: 8px; border: 1px solid #aed581; border-radius: 4px; }
        .input-group button { background-color: #43961c; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        #msg-list { padding-left: 20px; margin: 0; }

        .mobile-header, .mobile-menu { display: none; }

        @media (max-width: 768px) {
            .sidebar, .desktop-auth-bar { display: none; }

            .mobile-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                background-color: #dcedc8;
                border-bottom: 2px solid #43961c;
                padding: 0 20px; 
                height: 60px;
                position: sticky;
                top: 0;
                z-index: 100;
            }
            
            .logo-container {
                height: 100%;
                display: flex;
                align-items: center;
                overflow: hidden; 
                width: 130px; 
            }

            .mobile-header-logo {
                width: 100px; 
                height: auto;
                display: block;
            }
            
            .menu-btn { background: none; border: none; font-size: 2rem; cursor: pointer; color: #43961c; padding: 0; line-height: 1; }

            .mobile-menu {
                display: none; 
                flex-direction: column;
                background-color: #dcedc8;
                padding: 20px;
                border-bottom: 2px solid #43961c;
                box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            }
            .mobile-menu.active { display: flex; } 
            
            .mobile-menu .lang-link { margin-bottom: 20px; display: block; font-size: 1rem;}
            .mobile-menu .auth-area button { width: 100%; padding: 12px; font-size: 1rem; }
            .mobile-menu .auth-area .user-info { flex-direction: column; gap: 10px; align-items: flex-start; }

            .content { margin-left: 0; padding: 20px; }
            h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <div class="mobile-header">
        <a href="../" class="logo-container">
            <img src="../logo.jpg" alt="Grassic Logo" class="mobile-header-logo">
        </a>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </div>

    <div class="mobile-menu" id="mobileMenu">
        <a href="../" class="lang-link">&larr; English Version</a>
        
        <div class="auth-area">
            <div id="mobile-auth-buttons">
                <button onclick="window.location.href='/zh/auth.html'">注册 / 登录</button>
            </div>
            <div id="mobile-user-info" class="user-info" style="display: none;">
                <span>你好，<strong id="mobile-user-email"></strong></span>
                <button class="logout-btn" onclick="signOut()">退出登录</button>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <a href="../">         
            <img src="../logo.jpg" alt="Grassic Logo" class="brand-logo">
        </a>
        <div class="lang-switch">
            <a href="../" class="lang-link">&larr; English Version</a>
        </div>
    </div>

    <div class="content">
        
        <div class="desktop-auth-bar">
            <div class="auth-area">
                <div id="pc-auth-buttons">
                    <button onclick="window.location.href='/zh/auth.html'">注册 / 登录</button>
                </div>
                <div id="pc-user-info" class="user-info" style="display: none;">
                    <span>你好，<strong id="pc-user-email"></strong></span>
                    <button class="logout-btn" onclick="signOut()">退出登录</button>
                </div>
            </div>
        </div>

        <h1>Grassic-OS</h1>
        <h3>一个完全从零构建的独立裸机操作系统。</h3>

        <p><strong>1. 独立开发。</strong><br>
        由 danhuangjar 完全设计和编码，跳出既有操作系统的舒适区，从底层开始构建。</p>

        <p><strong>2. 免费且开源。</strong><br>
        内核完全开源。你可以在 GitHub 上查看原始代码、追踪开发进度，或者参与贡献。</p>

        <p style="margin-top: 25px;">
            &rarr; <a href="https://github.com/danhuangjar/Grassic-OS" class="main-link" target="_blank">在 GitHub 查看源代码</a>
        </p>

        <div class="test-box">
            <h3>留言板</h3>
            <div class="input-group">
                <input id="msg-input" type="text" placeholder="写点什么...">
                <button onclick="sendMessage()">发送</button>
            </div>
            <ul id="msg-list">
                <li>正在加载留言...</li>
            </ul>
        </div>

        <div class="footer">
            &copy; 2026 Grassic Studio.
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
        
        const supabaseUrl = 'https://eilhhwsbawpvfjmtjwbi.supabase.co' 
        const supabaseKey = 'sb_publishable_b6M1Xyi2aTEH67iH20IcGw_DqLdwbEn' 
        const supabase = createClient(supabaseUrl, supabaseKey)

        window.toggleMenu = function() {
            document.getElementById('mobileMenu').classList.toggle('active');
        }

        window.signOut = async () => {
            await supabase.auth.signOut()
            checkUser()
        }

        async function checkUser() {
            const { data: { session } } = await supabase.auth.getSession()
            
            if (session) {
                document.getElementById('pc-auth-buttons').style.display = 'none'
                document.getElementById('pc-user-info').style.display = 'flex'
                document.getElementById('pc-user-email').textContent = session.user.email

                document.getElementById('mobile-auth-buttons').style.display = 'none'
                document.getElementById('mobile-user-info').style.display = 'flex'
                document.getElementById('mobile-user-email').textContent = session.user.email
            } else {
                document.getElementById('pc-auth-buttons').style.display = 'block'
                document.getElementById('pc-user-info').style.display = 'none'

                document.getElementById('mobile-auth-buttons').style.display = 'block'
                document.getElementById('mobile-user-info').style.display = 'none'
            }
        }
        checkUser()

        window.loadMessages = async function() {
            try {
                const res = await fetch('/api/messages');
                const data = await res.json();
                const list = document.getElementById('msg-list');
                if (data.list && data.list.length > 0) {
                    list.innerHTML = data.list.map(item => `<li><strong>${item.email || '匿名用户'}</strong>: ${item.content}</li>`).join('');
                } else {
                    list.innerHTML = '<li>暂时没有留言，来发第一条吧！</li>';
                }
            } catch (error) {
                console.error("Error loading:", error);
                document.getElementById('msg-list').innerHTML = '<li style="color:red;">加载失败，请检查控制台。</li>';
            }
        }

        window.sendMessage = async function() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                alert("请先登录再留言！");
                return;
            }

            const input = document.getElementById('msg-input');
            const content = input.value.trim();
            if (!content) return;

            try {
                const res = await fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content, email: session.user.email })
                });
                if (res.ok) {
                    input.value = '';
                    loadMessages();
                } else {
                    alert('发送失败');
                }
            } catch (error) {
                console.error("Error sending:", error);
            }
        }

        loadMessages()
    </script>
</body>
</html>
