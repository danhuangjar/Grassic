<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grassic-OS | 独立操作系统项目</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #dcedc8; 
            color: #333;
            line-height: 1.6;
            display: flex;
        }

        .content, .sidebar {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .sidebar {
            width: 160px; 
            padding: 40px 15px;
            border-right: 2px solid #43961c; 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            position: fixed;
        }

        .brand-logo {
            width: 100px;
            height: auto;
            display: block;
        }

        .lang-link {
            color: #43961c;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .lang-link:hover {
            text-decoration: underline;
        }

        .content {
            margin-left: 160px; 
            padding: 40px 50px;
            max-width: 800px;
            box-sizing: border-box;
        }

        h1 {
            color: #43961c; 
            font-size: 2.8rem;
            margin-top: 0;
            margin-bottom: 10px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
            letter-spacing: -0.5px;
        }

        h3 {
            font-size: 1.15rem;
            color: #555;
            font-weight: 400;
            margin-top: 0;
            margin-bottom: 30px;
            letter-spacing: 0.2px;
        }

        p {
            margin-bottom: 15px;
            font-size: 1rem;
        }

        a {
            color: #43961c;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 1px dashed #43961c;
        }

        a:hover {
            background-color: #c5e1a5;
        }

        .footer {
            margin-top: 50px;
            font-size: 0.85rem;
            color: #666;
            border-top: 1px solid #aed581;
            padding-top: 15px;
        }

        .test-box {
            margin-top: 40px;
            padding: 20px;
            border: 2px dashed #aed581;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.4);
        }
        .test-box h3 {
            margin-top: 0;
            color: #43961c;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .input-group input {
            flex: 1;
            padding: 8px;
            border: 1px solid #aed581;
            border-radius: 4px;
            outline: none;
            font-family: inherit;
        }
        .input-group button {
            background-color: #43961c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
        }
        .input-group button:hover {
            background-color: #327513;
        }
        #msg-list {
            padding-left: 20px;
            margin: 0;
        }
        #msg-list li {
            margin-bottom: 5px;
            word-break: break-all;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 2px solid #43961c; 
                padding: 15px 20px;
                flex-direction: row;
                align-items: center;
            }
            .content {
                margin-left: 0;
                padding: 30px 20px;
            }
            h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="../">         
            <img src="../logo.jpg" alt="Grassic Logo" class="brand-logo">
        </a>
        <div class="lang-switch">
            <a href="../" class="lang-link">&larr; English</a>
        </div>
    </div>

    <div class="content">
        <h1>Grassic-OS</h1>
        <h3>一个完全由单人从零构建的独立裸机操作系统。</h3>

        <p><strong>1. 独立开发。</strong><br>
        由 danhuangjar 完全设计和编码，跳出既有操作系统的舒适区，从底层开始构建。</p>

        <p><strong>2. 免费且开源。</strong><br>
        内核完全开源。你可以在 GitHub 上查看原始代码、追踪开发进度，或者参与贡献。</p>

        <p style="margin-top: 25px;">
            &rarr; <a href="https://github.com/danhuangjar/Grassic-OS" target="_blank">在 GitHub 查看源代码</a>
        </p>

        <div class="test-box">
            <h3>后端测试：留言板</h3>
            <div class="input-group">
                <input id="msg-input" type="text" placeholder="输入留言并保存到数据库...">
                <button onclick="sendMessage()">发送</button>
            </div>
            <ul id="msg-list">
                <li>正在加载留言...</li>
            </ul>
        </div>

        <div class="footer">
            &copy; 2026 Grassic Studio.
        </div>
    </div>

    <script>
        async function loadMessages() {
            try {
                const res = await fetch('/api/messages');
                const data = await res.json();
                const list = document.getElementById('msg-list');
                
                if (data.list && data.list.length > 0) {
                    list.innerHTML = data.list.map(item => `<li>${item.content}</li>`).join('');
                } else {
                    list.innerHTML = '<li>暂时没有留言，来发第一条吧！</li>';
                }
            } catch (error) {
                console.error("加载失败:", error);
                document.getElementById('msg-list').innerHTML = '<li style="color:red;">加载失败，请检查控制台报错。</li>';
            }
        }

        async function sendMessage() {
            const input = document.getElementById('msg-input');
            const content = input.value.trim();
            if (!content) return;
            
            try {
                const res = await fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content })
                });
                
                if (res.ok) {
                    input.value = '';
                    loadMessages();
                } else {
                    alert('发送失败');
                }
            } catch (error) {
                console.error("发送失败:", error);
            }
        }

        loadMessages();
    </script>
</body>
</html>
